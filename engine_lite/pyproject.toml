[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "wesnoth-learning-lite"
version = "0.1.0"
requires-python = ">=3.10"
description = "Original Rust rules core and persistent direct Lua host for WesnothLearning"

[tool.maturin]
module-name = "_engine_lite"
features = ["pyo3/extension-module"]
